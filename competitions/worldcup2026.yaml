slug: worldcup2026
name: "FIFA World Cup 2026"
season: "2026"
competition_type: national_team

model:
  xi: 0.0023          # half-life ≈ 300 days (slower decay for national teams — they play infrequently)
  rho_init: 0.08      # Dixon-Coles correlation correction initial estimate
  max_goals: 10

ensemble:
  dc_weight: 0.5                  # weight for Dixon-Coles probability
  elo_weight: 0.5                 # weight for Elo probability
  max_model_disagreement: 0.12    # skip outcome if models disagree by > 12pp

edge:
  min_edge: 0.03      # only bet if ensemble prob exceeds fair market prob by ≥ 3%

kelly:
  multiplier: 0.25    # quarter Kelly — conservative for paper trading calibration phase

risk:
  max_bet_pct: 0.03                  # max 3% per bet (reduced from 5%)
  max_daily_exposure_pct: 0.15       # max 15% open simultaneously
  min_odds: 1.30                     # ignore heavy favourites
  max_odds: 5.00                     # reduced from 6.00 — less uncertain longshots
  max_model_overestimate_ratio: 2.0  # block if model > 2x market consensus (model error guard)

data:
  fixture_source: OddsApiFixtureSource
  odds_source: TheOddsApiSource
  odds_sport_key: soccer_fifa_world_cup
  historical_source: KaggleInternationalSource
