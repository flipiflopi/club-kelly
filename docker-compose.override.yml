# Local development overrides — NOT committed with sensitive values
# docker-compose up automatically merges this file
services:
  postgres:
    ports:
      - "5432:5432"   # expose postgres locally for psql / DBeaver

  backend:
    volumes:
      - .:/app         # mount repo so code changes are visible (Uvicorn --reload)
    environment:
      DEBUG: "true"
      LOG_LEVEL: DEBUG
    command: uvicorn backend.app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      target: dev      # use dev stage of frontend Dockerfile
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"   # Vite dev server
    command: npm run dev -- --host
